[workspace]
members = ["crates/rey-core", "crates/rey-desktop"]
resolver = "3"

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
