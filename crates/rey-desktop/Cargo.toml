[package]
name = "rey-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rey-core = { path = "../rey-core" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_commonmark = { version = "0.21.1", default-features = false, features = ["pulldown_cmark"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
hound = "3.5"
miniaudio = { package = "om-fork-miniaudio", version = "0.12.2", default-features = false, features = ["ma-log-level-error"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
